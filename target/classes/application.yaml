spring:
  application:
    name: agua-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agua_db}
    username: ${DB_USERNAME:agua_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never